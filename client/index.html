<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f1f2f4" />
		<title>Multiplayer Game</title>
		<link rel="icon" href="sprites/banana.png" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<p id="mode-status" class="mode-status" role="status" hidden>Using offline mode</p>
		<main id="entry-screen" class="entry-screen">
			<form id="join-form" class="join-form" novalidate>
				<label for="player-name">Enter your name</label>
				<input id="player-name" name="nickname" type="text" maxlength="20" autocomplete="nickname" enterkeyhint="go" spellcheck="false" aria-describedby="join-error" autofocus required />
				<p id="join-error" class="join-error" role="alert"></p>
				<noscript><p>JavaScript is required to join the game.</p></noscript>
			</form>
		</main>
		<main id="game-screen" class="game-screen" hidden>
			<div class="game-layout">
				<section class="play-area" aria-label="Game">
					<canvas id="canvas" width="1000" height="800" tabindex="0" aria-label="Multiplayer game world"></canvas>
					<div class="touch-controls" aria-label="Movement controls">
						<button id="W" data-key="w" class="icon-button" aria-label="Move up" title="Move up"><img src="icons/arrow-up.svg" alt="" /></button>
						<button id="A" data-key="a" class="icon-button" aria-label="Move left" title="Move left"><img src="icons/arrow-left.svg" alt="" /></button>
						<button id="S" data-key="s" class="icon-button" aria-label="Move down" title="Move down"><img src="icons/arrow-down.svg" alt="" /></button>
						<button id="D" data-key="d" class="icon-button" aria-label="Move right" title="Move right"><img src="icons/arrow-right.svg" alt="" /></button>
					</div>
				</section>
				<aside id="chat-panel" class="chat-panel" aria-labelledby="chat-title">
					<h2 id="chat-title">Chat</h2>
					<div id="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
					<form id="chat-form" class="chat-form"><input placeholder="Message..." id="chatInput" aria-label="Chat message" maxlength="300" autocomplete="off" /><button class="icon-button" type="submit" aria-label="Send message" title="Send message"><img src="icons/send.svg" alt="" /></button></form>
				</aside>
			</div>
		</main>
		<script src="world.js"></script>
		<script src="dungeon.js"></script>
		<script src="socket.io.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>
